[platformio]
default_envs = core
build_dir = D:/TEMP/${PROJECT_HASH}
libdeps_dir = D:/TEMP/${PROJECT_HASH}

[env]
platform = espressif32
framework = arduino
extra_scripts = pre:tools/gen_version_auto_h.py
build_flags =
	; -Wall -Werror
	-D DEBUG=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D SOOGH_TOUCH=1
	-D SOOGH_ENCODER_KEYS=1
	; -D SOOGH_DEBUG=1
	; -D KEYTOOL_FALLTHROUGH=1
	-I .
	-I include

lib_deps =
	https://github.com/knifter/lib-TwoWireDevice
	https://github.com/lvgl/lvgl.git#release/v9.2
    https://github.com/lovyan03/LovyanGFX

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1000000

[env:core]
board = m5stack-core-esp32
build_flags =
	${env.build_flags}
	-D SOOGH_DEV_M5CORE
lib_deps = 
	${env.lib_deps}
	; m5stack/M5Stack

[env:core2]
board = m5stack-core2
lib_deps = 
	${env.lib_deps}
build_flags =
	${env.build_flags}
	-D SOOGH_DEV_M5CORE2
	; -D SOOGH_TOUCH=1
	; m5stack/M5Core2@^0.0.6

